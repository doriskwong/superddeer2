name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller --name "排班工具" --collect-binaries ortools superdeer8.py

      - name: Prepare folder and zip
        run: |
          mkdir -p release
          cp -r dist/排班工具.app release/
          cd release
          zip -r ../排班工具_苹果版.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: 排班工具_苹果版.zip
